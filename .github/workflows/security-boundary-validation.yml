name: Security boundary validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-trust-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Test production deployment trust boundary
        run: node --test scripts/test-deploy-workflow-security.mjs
