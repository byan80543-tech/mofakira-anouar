name: Live XSS browser smoke test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/test-live-xss-smoke.mjs'
      - '.github/workflows/live-xss-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-xss-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-xss-smoke:
    name: Non-persistent XSS probes against published editor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out test revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test published website input gate
        env:
          ANWAR_TARGET_URL: https://mofakira-anouar.pages.dev/mofakira-anouar/
        run: node scripts/test-live-xss-smoke.mjs
