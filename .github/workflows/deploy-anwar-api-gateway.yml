name: Deploy Anwar API Gateway

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-anwar-api-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check required repository secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IP_HASH_SECRET: ${{ secrets.IP_HASH_SECRET }}
          ADHKAR_ADMIN_SECRET: ${{ secrets.ADHKAR_ADMIN_SECRET }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$IP_HASH_SECRET" || { echo "::error::Missing IP_HASH_SECRET repository secret"; exit 1; }
          test -n "$ADHKAR_ADMIN_SECRET" || { echo "::error::Missing ADHKAR_ADMIN_SECRET repository secret"; exit 1; }
          test "${#ADHKAR_ADMIN_SECRET}" -ge 32 || { echo "::error::ADHKAR_ADMIN_SECRET must contain at least 32 characters"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare temporary Worker secrets file
        shell: bash
        env:
          IP_HASH_SECRET: ${{ secrets.IP_HASH_SECRET }}
          ADHKAR_ADMIN_SECRET: ${{ secrets.ADHKAR_ADMIN_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$IP_HASH_SECRET"
          test -n "$ADHKAR_ADMIN_SECRET"
          jq -n \
            --arg ip "$IP_HASH_SECRET" \
            --arg admin "$ADHKAR_ADMIN_SECRET" \
            '{IP_HASH_SECRET: $ip, ADHKAR_ADMIN_SECRET: $admin}' \
            > "$RUNNER_TEMP/anwar-api-gateway-secrets.json"
          chmod 600 "$RUNNER_TEMP/anwar-api-gateway-secrets.json"

      - name: Deploy Worker and its secrets together
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.164.0"
          workingDirectory: workers/anwar-api-gateway
          command: deploy --secrets-file ${{ runner.temp }}/anwar-api-gateway-secrets.json

      - name: Show deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "Worker deployed: $DEPLOYMENT_URL"
          else
            echo "Deployment completed. Find the workers.dev URL in the deploy output above."
          fi
      - name: Remove temporary Worker secrets file
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/anwar-api-gateway-secrets.json"
