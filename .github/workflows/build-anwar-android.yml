name: Build Anwar Android Companion

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "prayer-times.js"
      - "official-adhkar.js"
      - "scripts/generate-native-adhkar-catalog.mjs"
      - "scripts/test-native-tasbih.mjs"
      - "scripts/test-native-notebook.mjs"
      - "scripts/test-native-notebook-archive.mjs"
      - "scripts/test-native-gateway.mjs"
      - "scripts/test-native-adhan.mjs"
      - "scripts/test-native-audio.mjs"
      - "scripts/test-native-adhkar.mjs"
      - ".github/workflows/build-anwar-android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "prayer-times.js"
      - "official-adhkar.js"
      - "scripts/generate-native-adhkar-catalog.mjs"
      - "scripts/test-native-tasbih.mjs"
      - "scripts/test-native-notebook.mjs"
      - "scripts/test-native-notebook-archive.mjs"
      - "scripts/test-native-audio.mjs"
      - "scripts/test-native-adhkar.mjs"
      - ".github/workflows/build-anwar-android.yml"

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate native adhan bridge and scheduling wiring
        run: node scripts/test-native-adhan.mjs
      - name: Validate native Media3 audio engine and catalogs
        run: node scripts/test-native-audio.mjs
      - name: Validate native personal adhkar screen and local storage
        run: node scripts/test-native-adhkar.mjs
      - name: Generate the complete native adhkar catalog from its canonical source
        run: node scripts/generate-native-adhkar-catalog.mjs
      - name: Validate native tasbih behavior, encryption and voice counting
        run: node scripts/test-native-tasbih.mjs
      - name: Validate native notebook editor, encryption and recovery
        run: node scripts/test-native-notebook.mjs
      - name: Validate portable notebook archive cryptography and PWA compatibility
        run: node scripts/test-native-notebook-archive.mjs
      - name: Validate two native gateways and icon destinations
        run: node scripts/test-native-gateway.mjs
      - name: Build debug APK and run unit tests
        run: gradle -p android assembleDebug testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anwar-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
