name: Anwar Shield Validation

on:
  pull_request:
    paths:
      - 'anwar-shield-3d.js'
      - 'scripts/test-anwar-shield-3d.mjs'
      - 'ANWAR-SHIELD-ISO3166-1.tsv'
      - '.github/workflows/anwar-shield-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check shield JavaScript syntax
        run: node --check anwar-shield-3d.js
      - name: Run shield regression tests
        run: node --test scripts/test-anwar-shield-3d.mjs
