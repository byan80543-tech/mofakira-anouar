name: Android validation
on:
  pull_request:
    paths:
      - "android/**"
      - "scripts/test-native-tasbih.mjs"
      - "scripts/test-android-private-storage.mjs"
      - "scripts/test-android-notebook-auth-bound-key.mjs"
      - "scripts/generate-native-adhkar-catalog.mjs"
      - "official-adhkar.js"
      - ".github/workflows/android-validation.yml"
permissions:
  contents: read
jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the native tasbih screen, catalog and preserved features
        run: node scripts/test-native-tasbih.mjs
      - name: Verify encrypted Android private storage and device re-authentication
        run: node scripts/test-android-private-storage.mjs
      - name: Verify the native notebook key requires device authentication
        run: node scripts/test-android-notebook-auth-bound-key.mjs
      - name: Compile the Android debug package
        run: gradle -p android assembleDebug
