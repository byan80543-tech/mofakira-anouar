name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest, icons, HTML IDs and JavaScript syntax
        run: node scripts/validate.mjs
      - name: Test notebook storage and recovery paths
        run: node scripts/test-storage.mjs
      - name: Validate offline app shell and local resources
        run: python3 scripts/validate_app.py
