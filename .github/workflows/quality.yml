name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate-pwa-icons:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate verified 192px and 512px PNG icons
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate-pwa-icons.py
      - name: Commit generated icons to the pull request branch
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          if git diff --cached --quiet; then
            echo "PWA icons are already up to date."
          else
            git commit -m "Generate correctly sized PWA icons"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
  static-validation:
    needs: generate-pwa-icons
    if: ${{ always() && (needs.generate-pwa-icons.result == 'success' || needs.generate-pwa-icons.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test radio continuity across in-app audio and foreground interruptions
        run: node scripts/test-radio-interruptions.mjs
      - name: Test selected devotional recordings in the radio page
        run: node scripts/test-ibtihalat-radio.mjs
      - name: Test Quran and prayer service dashboard navigation
        run: node scripts/test-service-dashboard.mjs
      - name: Test empty starter data and private visitor-owned adhkar
        run: node scripts/test-protective-adhkar.mjs
      - name: Test owner-only adhkar reading, publishing and access control
        run: node scripts/test-adhkar-workflow.mjs
      - name: Test adhkar management UI privacy and offline integration
        run: node scripts/test-adhkar-ui.mjs
      - name: Test compact prayer card and loading states
        run: node scripts/test-prayer-times-ui.mjs
      - name: Test direct tasbih icon opens its dialog
        run: node scripts/test-tasbih-open.mjs
      - name: Test tasbih counter, voice capture and dhikr management
        run: node scripts/test-tasbih-behavior.mjs
      - name: Test Arabic poetry voice dictation across Android result batches
        run: node scripts/test-poetry-dictation.mjs
      - name: Test shared HTML inspector
        run: python3 scripts/test_html_inspector.py
      - name: Test HTML and URL safety regression cases
        run: node scripts/test-html-safety.mjs
      - name: Validate manifest, icons, HTML IDs and JavaScript syntax
        run: node scripts/validate.mjs
      - name: Verify Content Security Policy and inline script hashes
        run: node scripts/test-csp.mjs
      - name: Test click-burst protection and cooldown
        run: node scripts/test-click-guard.mjs
      - name: Test movable, resizable tool panels and viewport safety
        run: node scripts/test-floating-panels.mjs
      - name: Validate Cloudflare Worker bundle and Wrangler bindings
        run: npx --yes wrangler@4.164.0 deploy --dry-run --config workers/anwar-api-gateway/wrangler.toml
      - name: Test notebook storage and recovery paths
        run: node scripts/test-storage.mjs
      - name: Test encrypted vault cryptography and backup integrity
        run: node scripts/test-vault-crypto.mjs
      - name: Test verified IndexedDB vault storage and legacy migration
        run: node scripts/test-vault-storage.mjs
      - name: Test encrypted save limits match vault restore limits
        run: node scripts/test-vault-save-guard.mjs
      - name: Test encrypted vault migration and rollback
        run: node scripts/test-vault-migration.mjs
      - name: Test encrypted vault startup and backup-only recovery
        run: node scripts/test-vault-startup.mjs
      - name: Test encrypted vault backup fallback and recovery
        run: node scripts/test-vault-recovery.mjs
      - name: Test manual-only encrypted vault lock policy
        run: node scripts/test-vault-idle-lock.mjs
      - name: Test encrypted radio, reader and tasbih preferences
        run: node scripts/test-vault-private-preferences.mjs
      - name: Test WebAuthn PRF device unlock and password wrapping
        run: node scripts/test-vault-device-unlock.mjs
      - name: Validate offline app shell and local resources
        run: python3 scripts/validate_app.py
      - name: Test service-worker lifecycle, caching and offline fallback
        run: node scripts/test-service-worker.mjs
      - name: Test smart update notification lifecycle
        run: node scripts/test-update-notice.mjs
      - name: Check asset cache-busting and service-worker shell freshness
        run: node scripts/test-asset-version-freshness.mjs
      - name: Test API gateway allowlist, cache and IP rate limiting
        run: node scripts/test-api-gateway.mjs
