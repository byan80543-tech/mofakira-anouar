name: Deploy Anwar Notebook to Cloudflare Pages

on:
  workflow_run:
    workflows:
      - Quality checks
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy a successful push to main from this repository, produced by
    # the exact trusted Quality checks workflow. Manual deployment is main-only.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.name == 'Quality checks' &&
       github.event.workflow_run.path == '.github/workflows/quality.yml' &&
       github.event.workflow_run.workflow_id == 420424205)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact commit that passed quality checks
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Prepare static site while preserving the PWA path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/mofakira-anouar

          while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|workers/*|scripts/*|android/*|_recovery/*|*.md|_headers)
                continue
                ;;
              # Digital Asset Links must be served from the origin root,
              # not from the nested PWA application scope.
              .well-known/*)
                mkdir -p "dist/$(dirname "$file")"
                cp "$file" "dist/$file"
                continue
                ;;
              robots.txt|sitemap.xml|privacy-security.html|privacy-security.json)
                cp "$file" "dist/$file"
                continue
                ;;
            esac
            mkdir -p "dist/mofakira-anouar/$(dirname "$file")"
            cp "$file" "dist/mofakira-anouar/$file"
          done < <(git ls-files -z)

          # Validate the association file when the final signing certificate
          # has been approved and the file has been added to the repository.
          if [ -f .well-known/assetlinks.json ]; then
            test -s dist/.well-known/assetlinks.json
            python3 -m json.tool dist/.well-known/assetlinks.json >/dev/null
            python3 - <<'PY'
          import json
          from pathlib import Path

          statements = json.loads(Path("dist/.well-known/assetlinks.json").read_text())
          assert isinstance(statements, list) and statements, "assetlinks.json must contain at least one statement"
          matches = [
              item for item in statements
              if "delegate_permission/common.handle_all_urls" in item.get("relation", [])
              and item.get("target", {}).get("namespace") == "android_app"
              and item.get("target", {}).get("package_name") == "com.anwar.mofakira.twa"
          ]
          assert matches, "assetlinks.json must authorize the configured TWA package"
          for statement in matches:
              fingerprints = statement.get("target", {}).get("sha256_cert_fingerprints", [])
              assert fingerprints and all(len(x) == 95 and x.count(":") == 31 for x in fingerprints), "Invalid SHA-256 signing certificate fingerprint"
          PY
          fi

          # Cloudflare Pages reads _headers from the output directory root,
          # not from the nested PWA application directory.
          test -s _headers
          cp _headers dist/_headers

          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=/mofakira-anouar/">
            <title>مفكرة أنوار</title>
          </head>
          <body>
            <p><a href="/mofakira-anouar/">افتح مفكرة أنوار</a></p>
          </body>
          </html>
          EOF

          # Fail the build if the security header file was misplaced or emptied.
          test -s dist/_headers
          grep -q "Content-Security-Policy:" dist/_headers
          grep -q "frame-ancestors 'none'" dist/_headers
          grep -q "X-Content-Type-Options: nosniff" dist/_headers
          grep -q "Strict-Transport-Security: max-age=31536000" dist/_headers
          for file in robots.txt sitemap.xml privacy-security.html privacy-security.json; do
            test -s "dist/$file"
          done
          python3 -m json.tool dist/privacy-security.json >/dev/null
          grep -Fq "Sitemap: https://mofakira-anouar.pages.dev/sitemap.xml" dist/robots.txt
          grep -Fq "https://mofakira-anouar.pages.dev/privacy-security.html" dist/sitemap.xml

      - name: Verify required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Create Pages project if it does not exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.164.0 pages project create mofakira-anouar --production-branch main || true

      - name: Deploy website to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.164.0 pages deploy dist --project-name=mofakira-anouar --branch=main
