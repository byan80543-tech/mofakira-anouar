name: Deploy Anwar Notebook to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare static site while preserving the PWA path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/mofakira-anouar

          while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|workers/*|scripts/*|*.md|_headers)
                continue
                ;;
            esac
            mkdir -p "dist/mofakira-anouar/$(dirname "$file")"
            cp "$file" "dist/mofakira-anouar/$file"
          done < <(git ls-files -z)

          # Cloudflare Pages reads _headers from the output directory root,
          # not from the nested PWA application directory.
          test -s _headers
          cp _headers dist/_headers

          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=/mofakira-anouar/">
            <title>مفكرة أنوار</title>
          </head>
          <body>
            <p><a href="/mofakira-anouar/">افتح مفكرة أنوار</a></p>
          </body>
          </html>
          EOF

          # Fail the build if the security header file was misplaced or emptied.
          test -s dist/_headers
          grep -q "Content-Security-Policy:" dist/_headers
          grep -q "frame-ancestors 'none'" dist/_headers
          grep -q "X-Content-Type-Options: nosniff" dist/_headers

      - name: Verify required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Create Pages project if it does not exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.164.0 pages project create mofakira-anouar --production-branch main || true

      - name: Deploy website to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.164.0 pages deploy dist --project-name=mofakira-anouar --branch=main
