name: Android Native Notes APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ANDROID-NATIVE/**"
      - ".github/workflows/android-native-build.yml"
  push:
    branches: [main]
    paths:
      - "ANDROID-NATIVE/**"
      - ".github/workflows/android-native-build.yml"

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Compile native notes app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ANDROID-NATIVE
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mofakira-anouar-native-debug
          path: ANDROID-NATIVE/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
