name = "anwar-api-gateway"
main = "src/index.mjs"
compatibility_date = "2026-11-18"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://mofakira-anouar.pages.dev"

[[durable_objects.bindings]]
name = "IP_LIMITER"
class_name = "IpRateLimiter"

[exports.IpRateLimiter]
type = "durable-object"
storage = "sqlite"

[[ratelimits]]
name = "EDGE_LIMITER"
namespace_id = "20261118"

[ratelimits.simple]
limit = 50
period = 60


[[durable_objects.bindings]]
name = "ADHKAR_STORE"
class_name = "AdhkarStore"

[exports.AdhkarStore]
type = "durable-object"
storage = "sqlite"
